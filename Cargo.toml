[workspace]
members = [
    "apps/gui",
    "crates/clip",
    "crates/core",
    "crates/character-segmentation",
    "crates/liquid-glass",
    "crates/waifu-sensor",
]
resolver = "3"

[workspace.package]
version = "0.0.1-beta"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
liquid-glass = { path = "crates/liquid-glass" }
memelith-core = { path = "crates/core" }
memelith-clip = { path = "crates/clip" }
waifu-sensor = { path = "crates/waifu-sensor" }
